version: 2
updates:
  # Maven dependencies for both producer and consumer modules
  - package-ecosystem: maven
    directories:
      - "/producer"
      - "/consumer"
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    labels:
      - dependencies
      - java
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
          - "org.springframework.kafka*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-plugins:
        patterns:
          - "org.apache.maven*"
          - "*maven-plugin"
      others:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework*"
          - "org.testcontainers*"
          - "org.apache.maven*"
          - "*maven-plugin"
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - github_actions
    groups:
      github-actions:
        patterns:
          - "*"
